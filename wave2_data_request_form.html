<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LASI-DAD Wave 2 MRI Data Request Form</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 0 20px;
    color: #222;
    line-height: 1.5;
  }
  h1 {
    font-size: 1.5em;
    margin-bottom: 30px;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  label {
    font-weight: bold;
    display: block;
    margin-bottom: 6px;
  }
  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    padding: 8px;
    font-size: 1em;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    font-family: inherit;
  }
  textarea {
    resize: vertical;
    min-height: 100px;
  }
  fieldset {
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 12px 16px;
  }
  legend {
    font-weight: bold;
    padding: 0 6px;
  }
  .checkbox-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 8px 0;
  }
  .checkbox-item input {
    margin-top: 4px;
  }
  .sub-item {
    margin-left: 28px;
  }
  .sub-item .checkbox-item {
    margin: 6px 0;
  }
  button {
    background-color: #1a73e8;
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 1em;
    border-radius: 4px;
    cursor: pointer;
    align-self: flex-start;
  }
  button:hover {
    background-color: #155cbb;
  }
</style>
</head>
<body>

<h1>Data Request Form</h1>

<form action="https://formspree.io/f/xyeyvvlr" method="POST">

  <div>
    <label for="project-title">Title of Project</label>
    <input type="text" id="project-title" name="project-title" required>
  </div>

  <div>
    <label for="investigators">Names of all investigators involved</label>
    <textarea id="investigators" name="investigators" required></textarea>
  </div>

  <div>
    <label for="primary-contact">Name of primary contact</label>
    <input type="text" id="primary-contact" name="primary-contact" required>
  </div>

  <div>
    <label for="primary-email">Primary contact email address</label>
    <input type="email" id="primary-email" name="primary-email" required>
  </div>

  <div>
    <label for="project-summary">Project summary</label>
    <textarea id="project-summary" name="project-summary" required></textarea>
  </div>

  <div>
    <label for="analysis-plan">Analysis plan</label>
    <textarea id="analysis-plan" name="analysis-plan" required></textarea>
  </div>

  <fieldset>
    <legend>Data requested</legend>

    <div class="checkbox-item">
      <input type="checkbox" id="freesurfer" name="data-requested" value="Freesurfer measures">
      <label for="freesurfer" style="font-weight: normal;">
        Complete set of Freesurfer measures (cortical and subcortical volume, cortical thickness) derived from T1-weighted MRI. Data is QC'ed and both site-adjusted and unadjusted.
      </label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="wmh" name="data-requested" value="White matter hyperintensity volume">
      <label for="wmh" style="font-weight: normal;">
        White matter hyperintensity volume derived from FLAIR MRI.
      </label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="raw-mri" name="data-requested" value="Raw MRI nifti files">
      <label for="raw-mri" style="font-weight: normal;">
        Raw MRI nifti files:
      </label>
    </div>

    <div class="sub-item">
      <div class="checkbox-item">
        <input type="checkbox" id="t1" name="raw-mri-type" value="T1-weighted">
        <label for="t1" style="font-weight: normal;">T1-weighted</label>
      </div>
      <div class="checkbox-item">
        <input type="checkbox" id="t2" name="raw-mri-type" value="T2-weighted">
        <label for="t2" style="font-weight: normal;">T2-weighted</label>
      </div>
      <div class="checkbox-item">
        <input type="checkbox" id="flair" name="raw-mri-type" value="FLAIR">
        <label for="flair" style="font-weight: normal;">FLAIR</label>
      </div>
      <div class="checkbox-item">
        <input type="checkbox" id="swi" name="raw-mri-type" value="SWI">
        <label for="swi" style="font-weight: normal;">SWI</label>
      </div>
      <div class="checkbox-item">
        <input type="checkbox" id="dwi" name="raw-mri-type" value="Multi-shell DWI">
        <label for="dwi" style="font-weight: normal;">Multi-shell DWI</label>
      </div>
      <div class="checkbox-item">
        <input type="checkbox" id="rsfmri" name="raw-mri-type" value="Resting state fMRI">
        <label for="rsfmri" style="font-weight: normal;">Resting state fMRI</label>
      </div>
    </div>

  </fieldset>

  <div>
    <label for="item-usage">How each item selected above be used in your project</label>
    <textarea id="item-usage" name="item-usage" required></textarea>
  </div>

  <button type="submit">Submit Request</button>

</form>

</body>
</html>
